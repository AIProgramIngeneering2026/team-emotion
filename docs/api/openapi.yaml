openapi: 3.0.3
info:
  title: AutoCheck API
  version: 0.1.0
  description: |
    Сервис автопроверки учебных работ.
    Все ошибки возвращаются в едином формате Error: код, сообщение и детали с полем, которое не так.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []

paths:
  /checks:
    post:
      operationId: createCheck
      summary: Поставить Проверку PR
      description: |
        Создаёт Проверку в состоянии queued и сразу возвращает её, сама проверка выполняется в фоне.
        Ограничения: тело до 16 КБ, до 20 проверок. PR больше 300 файлов завершается error с причиной pr_too_large.
        Повтор с тем же Idempotency-Key и тем же телом возвращает существующую Проверку с кодом 200.
        Тот же ключ с другим телом отклоняется с кодом 409.
        Ключ хранится 24 часа, после этого запрос с ним создаёт новую Проверку.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCreate'
            example:
              repo: AIProgramIngeneering2026/Zadania
              pr_number: 268
              checks: [structure, sections]
              params:
                structure:
                  root: teams/emotion/
      responses:
        '201':
          description: Проверка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '200':
          description: Повтор с тем же ключом и телом, возвращена существующая Проверка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Тело запроса больше 16 КБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: payload_too_large
                  message: Тело запроса больше 16 КБ
                  details:
                    limit_bytes: 16384
        '409':
          description: Ключ идемпотентности уже использован с другим телом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: idempotency_conflict
                  message: Ключ уже использован с другим телом запроса
                  details:
                    check_id: 3f1c9a2e-8b7d-4c1a-9e2f-0a1b2c3d4e5f
        '500':
          $ref: '#/components/responses/InternalError'

  /checks/{id}:
    get:
      operationId: getCheck
      summary: Состояние и результаты Проверки
      description: |
        id — случайный UUID v4, подобрать чужой нельзя. Несуществующий id даёт 404 без подробностей.
        Разделения Проверок по клиентам нет, см. ADR-0004.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: Проверка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /checks/{id}/cancel:
    post:
      operationId: cancelCheck
      summary: Отменить Проверку
      description: |
        Разрешено из queued и running. Незапущенные исполнители не запускаются, комментарий в PR не пишется.
        Результаты исполнителей, завершившихся до отмены, сохраняются и видны в GET /checks/{id}.
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: Проверка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Проверка уже в итоговом состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_transition
                  message: Нельзя отменить Проверку в состоянии passed
                  details:
                    from: passed
                    to: cancelled
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      operationId: health
      summary: Проверка живости сервиса и доступности БД
      security: []
      responses:
        '200':
          description: Сервис и БД доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: БД недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Один токен доступа к API из переменной окружения AUTOCHECK_API_TOKEN

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ запроса. Без него ответ 400 missing_idempotency_key
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CheckId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CheckCreate:
      type: object
      required: [repo, pr_number, checks]
      additionalProperties: false
      properties:
        repo:
          type: string
          pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          description: Репозиторий в виде owner/name
        pr_number:
          type: integer
          minimum: 1
        checks:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Имена проверок из реестра. Неизвестное имя даёт 400 unknown_check
          items:
            type: string
        params:
          type: object
          description: Параметры по имени проверки. Проверяются по схеме параметров Tool до создания Проверки
          additionalProperties:
            type: object

    CheckStatus:
      type: string
      enum: [queued, running, passed, failed, error, cancelled]

    Check:
      type: object
      required: [id, status, repo, pr_number, checks, results, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CheckStatus'
        repo:
          type: string
        pr_number:
          type: integer
        head_sha:
          type: string
          nullable: true
          description: Коммит PR, зафиксированный при переходе в running. Все Tool читают файлы этого коммита
        checks:
          type: array
          items:
            type: string
        error_reason:
          type: string
          nullable: true
          enum: [github_unavailable, pr_not_found, bad_github_response, pr_too_large, timeout, tool_error, null]
          description: Заполнено только в состоянии error
        comment_published:
          type: boolean
          description: false, если результат получен, но комментарий в PR опубликовать не удалось
        results:
          type: array
          items:
            $ref: '#/components/schemas/ToolResult'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ToolResult:
      type: object
      required: [check, status, problems]
      properties:
        check:
          type: string
          description: Имя проверки
        status:
          type: string
          enum: [passed, failed, error]
        problems:
          type: array
          description: Пусто при passed
          items:
            $ref: '#/components/schemas/Problem'
        error_reason:
          type: string
          nullable: true
          description: Заполнено только при status = error

    Problem:
      type: object
      required: [message]
      properties:
        path:
          type: string
          description: Файл PR, к которому относится проблема
        message:
          type: string

    ErrorCode:
      type: string
      enum:
        - validation_error
        - unknown_check
        - missing_idempotency_key
        - idempotency_conflict
        - payload_too_large
        - unauthorized
        - check_not_found
        - invalid_transition
        - internal_error

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Понятное человеку описание
            details:
              type: object
              description: Что именно не так. Для validation_error — field, для unknown_check — check
              additionalProperties: true

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [ok, unavailable]

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_error:
              value:
                error:
                  code: validation_error
                  message: pr_number должен быть целым числом больше 0
                  details:
                    field: pr_number
            unknown_check:
              value:
                error:
                  code: unknown_check
                  message: 'Неизвестная проверка: spellcheck'
                  details:
                    check: spellcheck
            missing_idempotency_key:
              value:
                error:
                  code: missing_idempotency_key
                  message: Нужен заголовок Idempotency-Key
                  details:
                    field: Idempotency-Key
    Unauthorized:
      description: Нет токена или токен неверный
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Нужен заголовок Authorization с верным токеном
              details: {}
    NotFound:
      description: Проверки с таким id нет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: check_not_found
              message: Проверка не найдена
              details:
                id: 3f1c9a2e-8b7d-4c1a-9e2f-0a1b2c3d4e5f
    InternalError:
      description: Непредвиденная ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Внутренняя ошибка, повторите запрос позже
              details:
                correlation_id: 8c2d1e7a
